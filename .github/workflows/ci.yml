# Continuous Integration: every push and pull request is checked automatically on a fresh GitHub-hosted machine.
# If any step fails, the commit gets a red ✗ on GitHub (and a PR can't be trusted until it's green).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # reuse downloaded packages between runs

      # `npm ci` installs exactly what package-lock.json says (unlike `npm install`, it never changes the lockfile)
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (engine, simulation, database mapping)
        run: npm test

      # No Supabase keys here, so the app builds in offline-demo mode — proving it builds for anyone who clones the repo.
      - name: Production build
        run: npm run build

  security:
    name: Database security (RLS) check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Uses the PUBLIC (anon/publishable) key, exactly like an outsider would, and tries to read and change private data.
    # Add both values under GitHub → Settings → Secrets and variables → Actions. Without them, this job skips itself.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        with:
          node-version: 22
      - name: Public key cannot read or change private data
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npm run check:rls
      - name: Skipped (no Supabase secrets configured)
        if: env.NEXT_PUBLIC_SUPABASE_URL == ''
        run: echo "Add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY as repository secrets to enable this check."
